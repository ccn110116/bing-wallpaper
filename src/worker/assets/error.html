<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Bing Wallpaper</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        .bgimg-header {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: url('/image/latestImage') no-repeat center center;
            background-size: cover;
            position: relative;
            color: white;
        }
        .bgimg-header::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.07);
            background-blend-mode: screen;
            backdrop-filter: blur(40px);
            z-index: 1;
        }
        .display-middle {
            position: relative;
            z-index: 2;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            margin-top: 20px;
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="bgimg-header">
        <div class="display-middle">
            <h1>Oops! Something went wrong.</h1>
            <p>We couldn't find the page you were looking for. It might have been moved or doesn't exist.</p>
            <a href="/" class="bar-item button">Return to Homepage</a>
        </div>
    </div>
</body>
</html>
