<!DOCTYPE html>
<html lang="en-us">
<head>
    <title data-key="htmlTitle">Bing Wallpaper</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="每日必应超清壁纸（4K）">
    <meta name="keywords" content="bing wallpaper, 必应壁纸, 必应4k壁纸, 必应超清壁纸, 壁纸">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display&family=Noto+Sans+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/main.js" type="module"></script>
    <link rel="preload" as="image" href="">
</head>
<body>
    
    <nav class="sticky-nav">
        <div class="bar transparent round">
            <div class="nav-links">
                <a href="/" class="bar-item button" data-key="home">Home</a>
                <a class="bar-item button" data-key="archive">Archive</a>
                <a href="https://github.com/niumoo/bing-wallpaper" target="_blank" class="bar-item button hide-small" data-key="github">GitHub</a>
                <a href="https://www.wdbyte.com/bing-wallpaper-400.html" target="_blank" class="bar-item button hide-small" data-key="about">About</a>
            </div>
            <div class="language-selector">
                <a href="/en-us" class="bar-item button" data-key="us">US</a>
                <a href="/zh-cn" class="bar-item button" data-key="cn">CN</a>
            </div>
            <button id="dark-mode-toggle" class="bar-item button">
                <svg class="icon icon-dark-mode" style="width: 24px; height: 24px;"><use href="/icons.svg#icon-dark-mode"></use></svg>
                <svg class="icon icon-light-mode" style="display: none; width: 24px; height: 24px;"><use href="/icons.svg#icon-light-mode"></use></svg>
            </button>
        </div>
    </nav>

    <div id="header-container" style="position: relative; height: 100vh;">
        <div class="smallImg-header"></div> <div class="bgimg-header">
            <div class="display-middle">
                <div class="glass-panel">
                    <h1 data-key="h1Title">Bing Wallpaper</h1>
                    <p></p>
                </div>
            </div>
        </div>
    </div>

    <div class="main content padding" style="max-width:1200px;">
        <div class="portfolio-grid" id="img_list">
            </div>
    </div>

    <footer class="center light-grey" style="padding: 60px;">
        <p>
            <span data-key="footerLine1"></span><br/>
            <span data-key="footerLine2"></span><br/>
            <span data-key="footerLine3"></span>
        </p>
    </footer>

    <div id="offline-banner" style="display: none;">You are currently offline.</div>

    <div id="overlay" class="overlay"></div>

    <div id="lightbox" class="lightbox">
        <div class="lightbox-image-wrapper">
            <div class="loading-spinner"></div>
            <div class="error-message" style="display: none;"></div>
            <img class="lightbox-content" id="lightbox-img">
        </div>
        <span class="close-lightbox">
            <svg class="icon"><use href="/icons.svg#icon-close"></use></svg>
        </span>
        <div id="lightbox-caption" class="lightbox-caption"></div>
        <div class="lightbox-controls">
                <a id="bing-link" href="#" target="_blank" class="control-button" title="View on Bing">
                	<svg class="icon" style="width: 24px; height: 24px; color: #F3F3F3;"><use href="/icons.svg#icon-bing"></use></svg>
           	</a>
            <div class="resolution-selector">
                <button class="control-button res-button" data-res="2k">
                    <svg class="icon" style="width: 24px; height: 24px; color: #F3F3F3;"><use href="/icons.svg#icon-2k"></use></svg>
                </button>
                <button class="control-button res-button active" data-res="4k">
                    <svg class="icon" style="width: 24px; height: 24px; color: #F3F3F3;"><use href="/icons.svg#icon-4k"></use></svg>
    </button>
            </div>
            <a id="download-link" href="#" download class="control-button" title="Download">
                <svg class="icon icon-download" style="width: 24px; height: 24px; color: #F3F3F3;"><use href="/icons.svg#icon-download"></use></svg>
                <svg class="icon icon-download-loading" style="display:none; width: 24px; height: 24px; color: #F3F3F3;"><use href="/icons.svg#icon-download-loading"></use></svg>
                <svg class="icon icon-download-done" style="display:none; width: 24px; height: 24px; color: #F3F3F3;"><use href="/icons.svg#icon-download-done"></use></svg>
            </a>
        </div>
    </div>

    <sidebar class="sidebar bar-block card top xlarge animate-left" id="sidebar">
        <a href="javascript:void(0)" class="bar-item button">
            <svg class="icon" style="width: 24px; height: 24px;"><use href="/icons.svg#icon-close"></use></svg>
    </a>
        <div id="archive-list"></div>
    </sidebar>

</body>
</html>
