<!DOCTYPE html>
<html>
<head>
    <title>必应壁纸 | Bing Wallpaper</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="每日必应超清壁纸（4K）">
    <meta name="keywords" content="bing wallpaper, 必应壁纸, 必应4k壁纸, 必应超清壁纸, 壁纸">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:ital,wght@0,100..900;1,100..900&family=Noto+Sans+Mono:wght@100..900&display=swap">
    <script src="/app.js"></script>
</head>
<body>
<div id="overlay" class="overlay" onclick="closeSidebar()"></div>
<div id="lightbox" class="lightbox">
    <div class="loading-spinner"></div>
    <span class="close-lightbox icon icon-close" onclick="closeLightbox()"></span>
    <img class="lightbox-content" id="lightbox-img">
    <div id="lightbox-caption" class="lightbox-caption"></div>
    <div class="lightbox-controls">
        <a id="bing-link" href="#" target="_blank" class="control-button" title="View on Bing">
            <i class="icon icon-bing" style="width: 24px; height: 24px; background-color: #F3F3F3;"></i>
        </a>
        <div class="resolution-selector">
            <button class="control-button res-button" data-res="2k">
                <i class="icon icon-2k" style="width: 24px; height: 24px; background-color: #F3F3F3;"></i>
            </button>
            <button class="control-button res-button active" data-res="4k">
                <i class="icon icon-4k" style="width: 24px; height: 24px; background-color: #F3F3F3;"></i>
            </button>
        </div>
        <a id="download-link" href="#" download class="control-button" title="Download">
            <i class="icon icon-download" style="width: 24px; height: 24px; background-color: #F3F3F3;"></i>
            <i class="icon icon-download-loading" style="display:none; width: 24px; height: 24px; background-color: #F3F3F3;"></i>
            <i class="icon icon-download-done" style="display:none; width: 24px; height: 24px; background-color: #F3F3F3;"></i>
        </a>
    </div>
</div>
<div id="header-container" style="position: relative; height: 100vh;">
    <div class="smallImg-header"></div> <!-- 模糊的小图 -->
    <div class="bgimg-header">
        <div class="display-middle">
            <div class="glass-panel">
                <h1>Bing Wallpaper</h1>
                <p></p>
            </div>
        </div>
    </div>
</div>

<!-- Sidebar (hidden by default) -->
<sidebar class="sidebar bar-block card top xlarge animate-left" id="sidebar">
    <a href="javascript:void(0)" onclick="closeSidebar()" class="bar-item button"><span class="icon icon-close"></span></a>
    <div id="archive-list"></div>
</sidebar>

<nav class="sticky-nav">
    <div class="bar transparent round">
        <div class="nav-links">
            <a href="/" class="bar-item button">首页</a>
            <a class="bar-item button" onclick="openSidebar()">归档</a>
            <a href="https://github.com/niumoo/bing-wallpaper" target="_blank" class="bar-item button hide-small">GitHub</a>
            <a href="https://www.wdbyte.com/bing-wallpaper-400.html" target="_blank" class="bar-item button hide-small">关于</a>
        </div>
        <div class="language-selector">
            <a href="/" class="bar-item button">US</a>
            <a href="/zh-cn" class="bar-item button">CN</a>
        </div>
        <button id="dark-mode-toggle" class="bar-item button">🌓</button>
    </div>
</nav>

<div class="main content padding" style="max-width:1200px;">

    <!-- First Photo Grid-->
    <div class="portfolio-grid" id="img_list">
    </div>
</div>

<!-- Footer -->
<footer class="center light-grey" style="padding: 60px;">
    <p>本站所有图片均来源于必应搜索
        <br/>
        Powered by <a href="https://github.com/niumoo/bing-wallpaper" target="_blank" class="hover-text-green">Github.com/niumoo</a>
        <br/>
        本网站已经开源，采用 Apache License 2.0 许可协议，复制请注明来自 <a href="https://github.com/niumoo/bing-wallpaper">bing-wallpaper</a>！
    </p>
</footer>
</body>
</html>
