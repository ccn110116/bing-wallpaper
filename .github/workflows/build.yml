name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Checkout worker branch
        uses: actions/checkout@v3
        with:
          ref: worker
          path: worker

      - name: Copy built files to worker branch
        run: |
          # Remove old structures and files safely
          rm -rf worker/dist
          rm -rf worker/src
          rm -f worker/assets/app.js
          rm -f worker/assets/style.css
          # Create new directories
          mkdir -p worker/src
          mkdir -p worker/assets
          # Copy the new build output
          cp -a dist/src/. worker/src/
          cp -a dist/assets/. worker/assets/

      - name: Commit and push changes to worker branch
        run: |
          cd worker
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/ assets/
          git commit -m "Build and deploy worker" || echo "No changes to commit"
          git push origin worker
