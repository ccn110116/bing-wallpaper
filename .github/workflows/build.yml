name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --omit=optional

      - name: Build
        run: npm run build

      - name: Checkout worker branch
        uses: actions/checkout@v3
        with:
          ref: worker
          path: worker

      - name: Copy built files to worker branch
        run: |
          # Clean only the old build artifacts, preserving the assets directory
          rm -rf worker/dist
          rm -rf worker/src
          # Create the new directories
          mkdir -p worker/dist
          mkdir -p worker/src
          # Copy the new build outputs
          cp dist/main.js worker/dist/
          cp dist/src/worker.js worker/src/

      - name: Commit and push changes to worker branch
        run: |
          cd worker
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/main.js src/worker.js
          git commit -m "Build and deploy worker" || echo "No changes to commit"
          git push origin worker
