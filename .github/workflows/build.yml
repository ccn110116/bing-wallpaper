name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --omit=optional

      - name: Build
        run: npm run build

      - name: Checkout worker branch
        uses: actions/checkout@v3
        with:
          ref: worker
          path: worker

      - name: Copy built files to worker branch
        run: |
          # Clean only the old build artifacts, preserving the assets directory
          rm -rf worker/dist
          rm -rf worker/src
          # Create the new directories
          mkdir -p worker/dist
          mkdir -p worker/src
          # Copy the new build outputs
          cp dist/main.js worker/dist/
          cp dist/worker.js worker/src/

      - name: Get current commit message from main
        id: get_message
        run: |
          # capture the latest commit message from the main checkout
          MESSAGE=$(git -C "$GITHUB_WORKSPACE" log -1 --pretty=%B)
          # write multiline output to GITHUB_OUTPUT
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit and push changes to worker branch
        run: |
          cd worker
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/main.js src/worker.js
          # write the possibly-multiline commit message to a temp file so git can use it
          printf '%s\n' "$COMMIT_MESSAGE" > /tmp/commit_message
          git commit -F /tmp/commit_message || echo "No changes to commit"
          git push origin worker
        env:
          COMMIT_MESSAGE: ${{ steps.get_message.outputs.message }}
