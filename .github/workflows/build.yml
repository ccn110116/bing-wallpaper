name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Checkout worker branch
        uses: actions/checkout@v3
        with:
          ref: worker
          path: worker

      - name: Copy built files to worker branch
        run: |
          mkdir -p worker/dist
          cp -r dist/* worker/dist/

      - name: Commit and push changes to worker branch
        run: |
          cd worker
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/
          git commit -m "Build and deploy worker" || echo "No changes to commit"
          git push origin worker