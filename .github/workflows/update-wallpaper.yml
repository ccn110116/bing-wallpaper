name: Update Wallpaper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Checkout worker branch
        uses: actions/checkout@v3
        with:
          ref: worker
          path: worker

      - name: Set Git user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Generate wallpaper files
        run: node worker/dist/main.js

      - name: Commit and push changes to worker branch
        run: |
          cd worker
          git add assets/data/
          git commit -m "Update Bing Wallpaper" || echo "No changes to commit"
          git push

      - name: Copy README.md to main branch
        run: |
          cp worker/README.md README.md

      - name: Commit and push README.md to main branch
        run: |
          git add README.md
          git commit -m "Update Bing Wallpaper README" || echo "No changes to commit"
          git push
