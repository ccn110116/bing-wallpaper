name: Update Wallpaper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Checkout worker branch
        uses: actions/checkout@v3
        with:
          ref: worker
          path: worker

      - name: Generate wallpaper files
        run: node worker/dist/main.js

      - name: Commit and push changes
        run: |
          cd worker
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/data/ README.md
          git commit -m "Update Bing Wallpaper" || exit 0
          git push
