name: Update Wallpaper Data

on:
  schedule:
    - cron: '8 16 * * *'
    - cron: '8 7 * * *'
    - cron: '8 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npx tsc

      - name: Generate wallpaper data
        run: node dist/update-wallpaper/index.js

      - name: Set Git user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit and push wallpaper data and README
        run: |
          git add --force src/worker/assets/data/
          git add --force README.md
          git commit -m "Update Bing Wallpaper data and README" || echo "No changes to commit"
          git push

