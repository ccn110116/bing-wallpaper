
<!DOCTYPE html>
<html>
<head>
    <title>必应壁纸 | Bing Wallpaper</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="每日必应超清壁纸（4K）">
    <meta name="keywords" content="bing wallpaper, 必应壁纸, 必应4k壁纸, 必应超清壁纸, 壁纸">
    <link rel="icon" href="/img/fav.jpg">
    <link rel="stylesheet" href="/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap">
    <style>
        .portfolio-item {
            position: relative;
            overflow: hidden;
        }
        .lightbox .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<script>
    function headerImgloading() {
        var bgImg = document.querySelector('.bgimg-header');
        var smallImg = document.querySelector('.smallImg-header');
        // 创建一个新的图片对象以监控加载状态
        var img = new Image();
        img.src = bgImg.style.backgroundImage.slice(4, -1).replace(/"/g, "");
        // 小图逐渐变透明
        smallImg.style.opacity = 0.3;
        img.onload = function() {
            setTimeout(function() {
                // 当大图加载完成时，首先显示大图
                bgImg.style.display = "block";
                smallImg.style.opacity = 0;
            }, 300);
        };
    }
    window.onload = headerImgloading; // 页面加载时执行
</script>
<body>
<div id="overlay" class="overlay" onclick="w3_close()"></div>
<div id="lightbox" class="lightbox">
    <div class="loading-spinner"></div>
    <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
    <div id="lightbox-caption" class="lightbox-caption"></div>
</div>
<div style="position: relative; height: 100vh;">
    <nav class="sticky-nav" style="position: absolute; top: 0; width: 100%; z-index: 10;">
        <div class="bar transparent round" style="max-width: 800px; margin: 20px auto; display: flex; justify-content: center; background-color: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px); border-radius: 25px; padding: 5px 0;">
            <a href="/" class="bar-item button hover-green" style="color: white;">首页</a>
            <a href="#portfolio" class="bar-item button hover-green" onclick="w3_open()" style="color: white;">归档</a>
            <a href="/zh-cn" class="bar-item button hover-green" style="color: white;">中国</a>
            <a href="https://github.com/niumoo/bing-wallpaper" target="_blank" class="bar-item button hover-green hide-small" style="color: white;">GitHub</a>
            <a href="https://www.wdbyte.com/bing-wallpaper-400.html" target="_blank" class="bar-item button hover-green hide-small" style="color: white;">关于</a>
            <div class="language-selector" style="background-color: rgba(0, 0, 0, 0.3); border-radius: 20px;">
                <a href="/zh-cn" class="bar-item button" style="color: white;">CN</a>
                <a href="/zh-tw" class="bar-item button" style="color: white;">TW</a>
                <a href="/zh-hk" class="bar-item button" style="color: white;">HK</a>
                <a href="/" class="bar-item button" style="color: white;">US</a>
            </div>
        </div>
    </nav>
    <div class="smallImg-header"></div> <!-- 模糊的小图 -->
    <div class="bgimg-header" style="padding: 20px;">
        <div class="display-middle padding-large wide text-light-grey center">
            <h1 class="hide-medium hide-small xxxlarge">Bing Wallpaper</h1>
        <div class=" padding-large text-light-grey" style="max-width: 800px">
            <p></p>
        </div>
        <h5 class="hide-large" style="white-space:nowrap">Bing Wallpaper</h5>
    </div>
</div>
</div>

<!-- Sidebar (hidden by default) -->
<sidebar class="sidebar bar-block card top xlarge animate-left" style="display:none;z-index:2;max-width:200px;min-width:100px" id="mySidebar">
    <a href="javascript:void(0)" onclick="w3_close()" class="bar-item button">收起</a>
    <div id="archive-list"></div>
</sidebar>


<div class="main content padding" style="max-width:1200px;">

    <!-- First Photo Grid-->
    <div class="portfolio-grid" id="img_list" style="padding: 20px;">
    </div>
</div>

<!-- Footer -->
<footer class="center light-grey padding-large large">
    <p>本站所有图片均来源于必应搜索

    </p>
</footer>
<script>
    // Script to open and close sidebar
    function w3_open() {
        document.getElementById("mySidebar").classList.add("open");
        document.getElementById("overlay").classList.add("open");
    }

    function w3_close() {
        document.getElementById("mySidebar").classList.remove("open");
        document.getElementById("overlay").classList.remove("open");
    }
    // 监听滚动事件
    window.addEventListener('scroll', function () {
        var wenjuan = document.getElementById('wenjuan');
        if (wenjuan && window.scrollY > 400) { // 如果向下滚动超过100px
            wenjuan.style.display = 'block'; // 显示该div
        } else if (wenjuan) {
            wenjuan.style.display = 'none'; // 否则隐藏
        }
    });
</script>
<script src="https://jsdelivr.wdbyte.com/npm/darkmode-js@1.5.7/lib/darkmode-js.min.js"></script>
<script>
    function addDarkmodeWidget() {
        const options = {
            label: '🌓'
        }
        new Darkmode(options).showWidget();
    }
    window.addEventListener('load', addDarkmodeWidget);

    fetch('/assets/data/months.json')
        .then(response => response.json())
        .then(months => {
            const archiveList = document.getElementById('archive-list');
            const groupedMonths = months.reduce((acc, month) => {
                const year = month.split('-')[0];
                if (!acc[year]) {
                    acc[year] = [];
                }
                acc[year].push(month);
                return acc;
            }, {});

            for (const year in groupedMonths) {
                const yearButton = document.createElement('button');
                yearButton.className = 'accordion';
                yearButton.textContent = year;
                archiveList.appendChild(yearButton);

                const panel = document.createElement('div');
                panel.className = 'panel';
                archiveList.appendChild(panel);

                groupedMonths[year].forEach(month => {
                    const monthLink = document.createElement('a');
                    monthLink.href = `${month}.html`;
                    monthLink.className = 'bar-item button hover-green large';
                    monthLink.textContent = month;
                    monthLink.onclick = w3_close;
                    panel.appendChild(monthLink);
                });
            }

            var acc = document.getElementsByClassName("accordion");
            for (var i = 0; i < acc.length; i++) {
                acc[i].addEventListener("click", function() {
                    this.classList.toggle("active");
                    var panel = this.nextElementSibling;
                    if (panel.style.maxHeight) {
                        panel.style.maxHeight = null;
                    } else {
                        panel.style.maxHeight = panel.scrollHeight + "px";
                    }
                });
            }
        });

    function openLightbox(imgSrc, caption) {
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const spinner = lightbox.querySelector('.loading-spinner');

        spinner.style.display = 'block';
        lightboxImg.style.display = 'none';
        document.getElementById('lightbox-caption').innerHTML = caption;
        lightbox.style.display = 'block';

        const highResImg = new Image();
        highResImg.src = imgSrc;
        highResImg.onload = () => {
            lightboxImg.src = imgSrc;
            spinner.style.display = 'none';
            lightboxImg.style.display = 'block';
        };
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    let preloadTimer;
    function handleImageMouseover(element, fullResUrl) {
        preloadTimer = setTimeout(() => {
            const highResImg = new Image();
            highResImg.src = fullResUrl;
        }, 400);
    }

    function handleImageMouseout(element, lowResUrl) {
        clearTimeout(preloadTimer);
        const img = element.querySelector('img');
        img.src = lowResUrl;
    }
</script>
</body>
</html>
